name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2.0.0" pandas openpyxl pyinstaller

    - name: Build EXE with PyInstaller Clean Standard
      run: |
        # 🚀 سر السرعة: التجميع كمجلد كامل (--onedir) ليلغي وقت فك الضغط ويفتح البرنامج فوراً بنقرة واحدة!
        pyinstaller --noconsole --onedir --icon=icon.ico tayeb.py

    # 📦 ضغط المجلد بالكامل في ملف ZIP واحد لسهولة النقل والشحن لصديقك
    - name: Zip Artifact Folder
      run: |
        powershell Compress-Archive -Path dist/tayeb/* -DestinationPath dist/tayeb-windows-app.zip

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: dist/tayeb-windows-app.zip

