name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl flet flet-desktop pyinstaller

    - name: Build EXE with PyInstaller Clean Standard
      run: |
        pyinstaller --noconsole --onefile --icon=icon.ico --collect-all flet --collect-all flet_desktop tayeb.py
      # 💡 المفتاح السحري: إجبار جيتهاب على دمج ملفات الواجهة كاملة داخل الـ EXE ليعمل في الجهاز الآخر بدون إنترنت
      env:
        FLET_EMBED_JS_TEMPLATE: "true"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: dist/tayeb.exe



