name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 💡 التعديل الهندسي المنقذ: تثبيت نسخة خفيفة ومستقرة من numpy لتشغيل التطبيق على الأجهزة القديمة والحديثة دفعة واحدة
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2.0.0" pandas openpyxl flet flet-desktop pyinstaller

    - name: Build EXE with PyInstaller Clean Standard
      run: |
        # 🚀 الأمر الكامل والأقوى لدمج الأيقونة، الفلات، والبانداس بالكامل داخل ملف واحد
        pyinstaller --noconsole --onefile --icon=icon.ico --collect-all flet --collect-all flet_desktop --collect-all pandas --collect-all openpyxl tayeb.py
      env:
        FLET_EMBED_JS_TEMPLATE: "true"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: dist/tayeb.exe


