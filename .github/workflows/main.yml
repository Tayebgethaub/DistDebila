name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies from requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        # في حال عدم وجود ملف أيقونة، يمكن حذف --icon أو إضافة ملف افتراضي
        pyinstaller --noconsole --onedir --clean tayeb.py

    - name: Zip Artifact Folder
      run: |
        powershell Compress-Archive -Path dist/tayeb/* -DestinationPath dist/tayeb-windows-app.zip -Force

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: dist/tayeb-windows-app.zip
