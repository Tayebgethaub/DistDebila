name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pandas openpyxl flet flet-desktop pyinstaller

    # دمج حزم العرض والأصول كاملة داخل ملف الـ EXE ليعمل أوفلاين 100% وبدون إنترنت في أي كمبيوتر آخر
    - name: Build EXE with PyInstaller Clean Standard Offline
      run: |
        pyinstaller --noconsole --onefile --collect-all flet --collect-all flet_desktop tayeb.py
      env:
        FLET_EMBED_JS_TEMPLATE: "true"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: dist/tayeb.exe

