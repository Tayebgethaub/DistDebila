# اسم سير العمل (Workflow)
name: Build Windows EXE

# تحديد متى يتم تشغيل هذا الملف (عند دفع كود جديد إلى الفرع الرئيسي "main")
on:
  push:
    branches: [ "main" ]

# الوظائف التي سيقوم بها السيرفر الافتراضي
jobs:
  build:
    # تشغيل المهمة على خادم ويندوز افتراضي توفره جيت هاب
    runs-on: windows-latest

    steps:
    # 1. سحب ملفات المشروع الحالي إلى داخل السيرفر
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد وتثبيت لغة بايثون على سيرفر ويندوز
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. تثبيت المكتبات اللازمة ومكتبة التحويل PyInstaller
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 4. تشغيل أمر التحويل لملف tayeb.py إلى ملف EXE واحد مستقل
    - name: Build EXE File
      run: |
        pyinstaller --onefile tayeb.py

    # 5. رفع ملف الـ EXE الناتج إلى صفحة جيت هاب لكي تتمكن من تحميله
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/tayeb.exe
