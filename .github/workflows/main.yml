name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir pandas openpyxl flet

    # دمج حزم العرض والأصول كاملة لتعمل أوفلاين 100% باستخدام أمر البناء الرسمي الحديث لشركة Flet
    - name: Build Windows EXE via Official Flet Builder
      run: |
        flet build windows

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: build/windows/tayeb.exe

