name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl flet

    - name: Build Windows Executable via Flet Official
      run: |
        flet build windows tayeb.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tayeb-windows-app
        path: build/windows/
